name: task_manager
description: Study Planner & Task Manager - A complete academic organizer for students
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Icons & UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  lottie: ^3.2.0
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  riverpod_generator: 2.4.0

flutter:
  uses-material-design: true
